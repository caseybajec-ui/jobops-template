    category: consulting
    program: Business Analyst, US full-time
    # class_year: set by the setup step
    status: unconfirmed
    confidence: historical-estimate
    source: https://www.mckinsey.com/careers
    verified: 2026-01-01
    note: Verify on the firm's site. Campus dates differ from the national one; ask career services.


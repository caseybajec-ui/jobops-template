# ---------- InfraRed 100 (2026): Lightspeed portfolio companies ----------
#
# Added 2026-09-05. Every slug below was probed with fetch_jobs.probe_board,
# which validates response SHAPE, not status codes, and each board's IDENTITY
# was then confirmed by reading a real posting off it — not by the slug matching
# the company name. Role counts are as of that probe.
#
# THE SECTION NAME IS WHAT MAKES THESE FETCH. cmd_fetch matches `greenhouse` or
# anything ending `_greenhouse`, so `infrared_greenhouse` is polled like any
# other group. The `source:` field on each entry is provenance for a human;
# nothing reads it, and nothing should start reading it instead of the section.
#
# NOT PREFIXED `defense_`. score_jobs.cmd_gate treats every `defense_*` section
# as a defense company, and none of these are.
#
# SIX OF THE 27 DID NOT RESOLVE and are deliberately absent rather than
# guessed at: Arctic Wolf, Cyera, Emergent, Nexthop AI, Patronus AI, Reactor.
# Each was probed against Greenhouse, Lever, Ashby and Rippling on the
# obvious slug plus hand-written variants. They are almost certainly on a custom
# or embedded ATS. Adding a wrong slug is worse than an absent one: it fetches
# somebody else's roles under the target company's name.
#
# RE-CHECKED 2026-09-07 with `fetch_jobs.py resolve`, which reads the company's
# OWN careers page for a link to ashbyhq / greenhouse / lever rather than
# guessing a slug -- the method that finally resolved Mistral, whose board is
# `ashby/mistral.ai` and whose dot no variant generator would ever produce.
# All six still unresolved, and this time for a reason that was READ rather
# than inferred:
#
#   Arctic Wolf   arcticwolf.com  careers page loads, no ATS link in the html
#   Cyera         cyera.io        careers page loads, no ATS link in the html
#   Patronus AI   patronus.ai     careers page loads, no ATS link in the html
#   Nexthop AI    nexthop.ai      /careers 404s; /join-us has no ATS link
#   Emergent      emergent.sh     no ATS link on any careers path tried
#   Reactor       reactor.com     no ATS link on any careers path tried
#
# All of them render their board client-side, so the link exists only after
# JavaScript runs. THE RESOLVER IS NOT BROKEN: pointed at mistral.ai it finds
# `ashby/mistral.ai`, probes it, and prints three real postings whose text
# begins "ABOUT MISTRAL". A tool that reports nothing has to be shown finding
# something before its nothing means anything.
#
# MACH INDUSTRIES, settled, and now RETIRED (2026-09-09). `resolve` finds no
# ATS link on mach.industries, and `discover` reports the board "responded but
# listed 0 roles (likely wrong slug)" -- which is Ashby answering HTTP 200 for
# a slug that is not theirs, the same behaviour that makes a 200 from Ashby
# prove nothing.
#
# It was left in on the reasoning that it costs one request a night. That was
# wrong about the cost. The request is free; the ANOMALY LINE is not. A board
# that has never returned a role is a permanent zero, so it produced a line in
# the digest's health section every single morning for a board that was never
# Mach's -- and a warning that is always there is one that stops being read,
# which is the failure mode the health section exists to avoid.
#
# It carries `retired:` now: skipped by the fetcher, still in the file with
# its reason, so nobody re-adds the same wrong slug on the assumption that
# nobody tried. If a real board appears, replace the key.
#
# EON IS EXCLUDED ON PURPOSE, and this is the Shield AI failure repeating.
# `ashby/eon` answers with 7 roles and looks like a clean hit. It is a stealth
# a16z-backed space company in Culver City building free-space laser links in
# MEO — its own posting says so — and has nothing to do with the InfraRed 100
# EON. A board that answers is not a board that is theirs.
#
# ===================== MONITORING ONLY. NOT AN APPLICATION LIST. =====================
#
# THESE 16 COMPANIES ARE NOT 16 APPLICATIONS. Read that again next cycle, because
# a block of freshly-added tier-1 and tier-2 names reads like a to-do list and is
# not one.
#
# THE MEASUREMENT, from the first real fetch of all 16 boards: roughly 1,300
# open titles, of which ~170 passed title_ok, of which exactly TWO carried an
# early-career signal (one Associate Product Manager, one Software Engineer New
# Grad — in Paris). The rest are overwhelmingly senior ICs, solutions architects
# and sales. For a new grad with a dated start, every req on these boards today
# will be filled long before the start date.
#
# THE DEPLOYMENT STRATEGIST TITLES ARE THE TRAP, and this was settled by reading
# the postings rather than the titles. Mistral runs seventeen "AI Deployment
# Strategist" reqs and one of them is "- USA" in Palo Alto — the exact shape of
# Palantir Deployment Strategist. Every one of them scored at the bottom, and the
# posting says why in its own words: "4+ years in a client-facing strategic and
# technical role" and "a degree in a relevant scientific field". A MATCHING
# TITLE IS NOT A MATCHING ROLE — the same lesson as `ashby/eon`, one layer in:
# that board was not theirs, and this board is theirs but the req is still not
# a new grad's.
#
# So what they are FOR: knowing which companies open roles shaped like the ones
# the owner wants, so relationships can be built now and applications made when
# the dated programmes post. That is intelligence, and it belongs on Company
# view — which is the landing view for exactly this reason — not in a queue of
# things to do this week. Mistral in particular is worth OUTREACH now precisely
# BECAUSE it runs that shape of role in the US continuously; it is pinned into
# the outreach queue by decision rather than by score, and the row says which.
#
# WHAT WOULD CHANGE THIS: a dated or new-grad req appearing on one of these
# boards, IN THE US. The daily fetch will surface it as an Excellent-fit role in
# the digest if it does. Until then, the correct number of applications to these
# 16 is zero.
# =====================================================================================


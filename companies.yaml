# ---------- Title filters ----------
# Matching is WORD-BOUNDARY, not bare substring. Bare substrings silently
# over-excluded: "intern" killed every "International" role, "iv" killed
# "Activity" and "Drive", and "lead" killed "Leadership" — which defeated the
# "leadership development" include term entirely. See test_filters.py.
#
# Evaluation order in title_ok():
#   1. title_exclude  -> drop (hard-no function, regardless of level)
#   2. title_senior   -> drop (too senior)
#   3. title_level    -> PASS (explicit early-career signal)
#   4. title_include  -> pass if a topic term matches
# Unleveled titles fall through to step 4, so startup roles that carry no level
# signal either way still reach the scorer rather than being dropped.
#
# THESE FIVE LISTS ARE TUNED, NOT GUESSED. They encode months of reading what
# each term did to a corpus of ~10,000 titles. The setup step re-tunes them for
# the owner's job types (an engineer wants "engineer" back in title_include; a
# student with an internship cycle left wants "intern" out of title_exclude).
# Any change must keep `python test_filters.py` green.

# Topic signals. Deliberately NOT "engineer" on its own — it matched ~700
# staff-level hardware roles at Anduril alone. Topic match is not fit.
title_include:
  - product
  - associate
  - analyst
  - founding
  - chief of staff
  - strategy
  - strategic
  - operations
  - bizops
  - business operations
  - growth
  - forward deployed
  - deployment
  - mission
  - program manager
  - technical program
  - investment
  - venture
  - government
  - federal
  - public sector
  - defense
  - national security
  - capture
  - corporate development
  - go-to-market

# Positive early-career signals. A match here passes even without a topic term,
# because "New Grad Rotational Program" may carry no topic word at all.
title_level:
  - new grad
  - new graduate
  - university
  - university grad
  - early career
  - entry level
  - entry-level
  - campus
  - rotational
  - leadership development
  - apm
  - associate product manager
  - graduate program
  - analyst program
  - "i"          # standalone level token, e.g. "Product Analyst I"
  - "2027"

# Seniority signals. Checked before title_include, so these drop a role even if
# it matches a topic term. NOTE: "chief" is deliberately absent — it would kill
# "Chief of Staff", a tier-1 target. "manager" is absent for the same reason:
# "Product Manager" is a legitimate new-grad title.
title_senior:
  - senior
  - sr
  - staff
  - principal
  - director
  - "head of"
  - vp
  - president
  - distinguished
  - fellow
  - architect
  - senior manager
  - group manager
  # A GPM is typically an eight-year title, and "group manager" does not
  # catch it: "Group Product Manager" has a word between the two, so the
  # literal never matches. Seven real GPM postings were passing the filter.
  - group product manager
  # The abbreviation, which matches NOTHING in the corpus today — pure
  # insurance, added because a board that writes "GPM, Growth" would
  # otherwise slip straight through. Safe as a bare token because
  # _term_re's boundaries are NON-ALPHANUMERIC: it fires on "(GPM)" and
  # "GPM," but never inside a longer word.
  - gpm
  - lead
  - "ii"
  - "iii"
  - "iv"

# Exempt from the seniority check ONLY (title_exclude still applies).
# "Chief of Staff" is a tier-1 target and contains "staff", which is otherwise a
# reliable seniority signal ("Staff Engineer", "Staff+ Security Engineer").
title_protect:
  - chief of staff

# Hard-no functions, dropped regardless of level.
title_exclude:
  - sales
  - account executive
  - sales development
  - recruiter
  - recruiting coordinator
  - intern           # the setup step removes this if the owner still has an internship cycle
  - internship
  - contractor
  - temporary

# ---------- Calendar-driven deadlines ----------
# Consulting, VC, and the primes' rotational programmes are STRUCTURALLY INVISIBLE
# to the fetcher: they run custom ATSs with no public JSON. They are also the only
# hard deadlines in the whole search. A wrong note here already nearly cost a
# cycle — an old comment said MBB "closes mid/late September"; McKinsey actually
# closed on 11 August that year.
#
# EVERY ROW BELOW IS A PROMPT TO CHECK, NOT A FACT. The template ships the
# well-known programmes with NO dates, `status: unconfirmed` and
# `confidence: historical-estimate`, and a deliberately stale `verified:` so
# every one of them shows as STALE in the UI until the owner reads the firm's
# own page. The only way a row becomes `verified` is a human typing the date
# in — on the Daily page ("checked it", with a date) or here.
#
# confidence:
#   verified            — OFFICIAL: employer-stated, read from the firm's own site
#   secondary-source    — consistent across 2+ independent trackers/university pages
#   historical-estimate — inferred from prior years; treat as a prompt to check
#   planning-target     — NOT a company date at all. A readiness date the owner set
#                         for themselves, for a firm that has published nothing. The
#                         date lives in `target:`, NEVER in `closes:` — the app and
#                         verify_deadlines.py both refuse a planning-target row that
#                         carries `closes`, because fed through as a close it rendered
#                         with the same countdown as a verified deadline. That is the
#                         McKinsey failure in a new form: a date nobody at the firm
#                         set, dressed as a fact.
#
# rolling: true       — the firm has said there is no cutoff (open until filled).
#                       A stated fact, so it renders as one instead of "not confirmed".
#                       Rolling firms with an OPEN window get a daily reminder in the
#                       digest until something is submitted (web/lib/consulting.js).
#
# class_year          — the setup step writes it from profile.json's graduation on
#                       every row. It is omitted here on purpose so a cloned template
#                       cannot carry somebody else's class year.
#
# minutes:            — optional; how long the ACTION takes, not the window. Daily's
#                       ladder refuses to put a task at the top that does not fit the
#                       time available. A stated fact — nothing infers it.
#
# Closed windows keep their date so they resurface next cycle and so Forecast
# stops treating them as live. Re-check with: python verify_deadlines.py
# Anything verified more than 14 days ago shows as STALE in the UI.

deadlines:
  # --- MBB: fixed national deadlines, typically mid-summer for a full-time start ---

# Target companies, grouped by the ATS that hosts their public job board.
# Verify any slug with:
#     python fetch_jobs.py discover <company-name>
# which tries Greenhouse, Lever, Ashby, and Rippling and reports EVERY board that
# answers with a valid payload. It validates response shape, not status code:
# Ashby returns HTTP 200 with a JS shell for any slug at all, so a 200 proves
# nothing. If discover flags a board with only 1 role, verify it by hand — that
# is the signature of a demo or test board, not a real one.
#
# Companies on custom ATSs (McKinsey, BCG, Bain, most large banks, many VC firms)
# can't be polled. Track those in `manual` and check them by hand.
#
# THIS IS A TEMPLATE LIST. The slugs are public facts and were each verified
# live on the date in their note; the tiers and the one-line notes are a
# starting point for a business / product / operations new grad and the setup
# step re-tunes them for the owner. Add, retire or re-tier freely — but verify
# every new slug with `discover` before it goes in, and never delete a retired
# entry (see Mach Industries below for why).


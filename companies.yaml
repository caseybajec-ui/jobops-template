# `category:` is the COMPANY's kind, and it drives the coloured dot beside every
# company name in the app. Four values only: defense, product, consulting, vc.
#
# It is almost always derivable and so it is almost always absent: every entry
# under a `defense_*` group is defense, and everything else defaults to product.
# The key appears ONLY where neither of those is right — Palantir sits under
# `lever:` and is a defense company, and the three growth-equity boards sit under
# `new_greenhouse:` and are not product companies.
#
# Do NOT confuse this with the per-ROLE `category` column in the jobs table. That
# one is written by the fetcher, is NULL on most rows, and taking MAX() of it
# once made Stripe read as a venture firm because four of its postings are
# tagged vc and "vc" sorts after "product".
